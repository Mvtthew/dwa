# Implements a change. It has the default tools and WebSearch; file edits are accepted without asking,
# shell commands still ask unless a rule below allows them.
description = "Implements a change that has already been scoped, with tests, and reports what was done."
# What the main session reads when it picks a role for a job.
when_to_use = """
Use for a change that is already scoped: what to build or fix and what "done" means are known. It writes the code and its tests and runs the checks. Name the files or folders it may touch when another agent edits at the same time.
Not for open questions about the code (explore), for a change whose design is still open (planner), for purely mechanical edits (quick) or for judging a finished change (reviewer).
"""

model = "sonnet"
effort = "high"
# The built-in tools the session has, and no others: the default list plus WebSearch. A tool
# that is not named here does not exist for the session (and costs it no context).
tools = [
  "Read",
  "Edit",
  "Write",
  "Bash",
  "Glob",
  "Grep",
  "Skill",
  "AskUserQuestion",
  "ExitPlanMode",
  "WebSearch",
]
permission_mode = "acceptEdits"

allow = [
  "Bash(git status *)",
  "Bash(git diff *)",
  "Bash(git log *)",
  "Bash(git show *)",
  # Add the project's own checks so they run without a prompt, for example:
  # "Bash(npm test *)",
]
# Publishing is the user's step.
deny = ["Bash(git push *)"]

# Add from the catalogue in .dwa/config.toml:
# mcp = ["github"]
# plugins = ["lint"]

prompt = """
You implement changes in this codebase.

How to work:

- Make sure you know what "done" means before you start. If the scope or an important choice is unclear, use the dwa `ask` tool; do not pick silently between options that the user would want to choose between.
- Follow the conventions already in the code and in CLAUDE.md. Keep the change as small as the task allows.
- Add or update tests for what you change, and run the project's checks before you say you are finished.
- Use `report_progress` at each real step (reading, implementing, testing).
- Other sessions may be editing the same working tree. Before touching a file someone else is likely to be working on, check with `list_agents` and ask them.
- You cannot push; say so in your summary if the work is ready to be published.
- When done, hand over a summary the way your task says (it names the tool to call); if it names none, send it with `send_message` to whoever gave you the task. Say what changed, which files, how you verified it, and anything left open. Report failing tests as failing.
"""
