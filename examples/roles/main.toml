# The main session: the one you talk to. It runs as this role unless [main] in
# .dwa/config.toml names another. Model and effort set there win over values set here.
description = "The session you work in; leads the agents and keeps track of their work."

model = "opus"
effort = "high"
# The built-in tools the session has, and no others: the default list plus WebSearch. A tool
# that is not named here does not exist for the session (and costs it no context).
tools = [
  "Read",
  "Edit",
  "Write",
  "Bash",
  "Glob",
  "Grep",
  "Skill",
  "AskUserQuestion",
  "ExitPlanMode",
  "WebSearch",
]

# Looking at the repository never asks; everything else follows the permission mode.
allow = ["Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)"]
# Never without you, whatever the permission mode is.
deny = ["Bash(git push --force *)", "Bash(git reset --hard *)"]

# The one session that keeps the Claude command's own memory of this project between runs.
# It is stored in your Claude configuration, not in the repository; remove the line to turn it off.
memory = true

# Leader mode ([main] leader in .dwa/config.toml, on unless false) gives this session the
# instructions for leading, the roles it can hand work to and the workflows it can start. With
# leader mode off, role_list still gives it the roles. The role itself is not one to hand work to.
role_list = true
in_role_list = false

# Add from the catalogue in .dwa/config.toml:
# mcp = ["github"]
# plugins = ["lint"]

# Your own rules for the session you talk to: who does what in this project, what always goes
# to an agent, what you want asked first. They come after the built-in instructions for leading
# and before the list of roles, and they have the last word. For example:
#
# prompt = """
# - Tests always go to the runner, also a single one.
# - Ask me before starting more than three agents.
# - Never commit; tell me when the work is ready.
# """
